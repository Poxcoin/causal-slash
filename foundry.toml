[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "tests"
solc_version = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/"
]

[profile.default.fuzz]
runs = 2048
max_test_rejects = 65536

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

